name: Place AI CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: place-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: docker compose config --quiet
      - name: Build and start the local stack
        run: docker compose up --build --detach
      - name: Wait for the judge API
        run: npm run wait:arena
      - name: Exercise the complete submission flow
        run: npm run test:smoke
      - name: Record judge toolchain versions
        run: docker run --rm --entrypoint /bin/sh place-ai-judge:local -c 'gcc --version && g++ --version && python3 --version'
      - name: Exercise browser navigation and workspace
        timeout-minutes: 5
        run: |
          if command -v google-chrome; then
            export PLACE_BROWSER_CHANNEL=chrome
          else
            npx playwright install chromium
          fi
          npm run test:browser
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
